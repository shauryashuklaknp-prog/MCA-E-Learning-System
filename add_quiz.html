{% extends "base.html" %}

{% block title %}
Create Quiz
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Create New Quiz</h2>

    <form method="POST">

        <label>Select Course</label>

        <select name="course_id" required>

            <option value="">
                Select Course
            </option>

            {% for course in courses %}

            <option value="{{ course['id'] }}">
                {{ course['title'] }}
            </option>

            {% endfor %}

        </select>

        <label>Quiz Title</label>

        <input
            type="text"
            name="title"
            placeholder="Example: Python Basics Quiz"
            required
        >

        <button type="submit">
            Create Quiz
        </button>

    </form>

</div>

{% endblock %}
