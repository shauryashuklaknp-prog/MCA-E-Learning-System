{% extends "base.html" %}

{% block title %}
Edit Course
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Edit Course</h1>

    <form method="POST">

        <label>Course Title</label>
        <input
            type="text"
            name="title"
            value="{{ course['title'] }}"
            required
        >

        <br><br>

        <label>Description</label>
        <textarea
            name="description"
            required
        >{{ course['description'] }}</textarea>

        <br><br>

        <label>Duration</label>
        <input
            type="text"
            name="duration"
            value="{{ course['duration'] }}"
            required
        >

        <br><br>

        <label>Instructor</label>
        <input
            type="text"
            name="instructor"
            value="{{ course['instructor'] }}"
            required
        >

        <br><br>

        <button type="submit">
            Update Course
        </button>

    </form>

    <br>

    <a href="/admin-dashboard">
        <button type="button">
            Cancel
        </button>
    </a>

</div>

{% endblock %}
